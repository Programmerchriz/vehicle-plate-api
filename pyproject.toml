[project]
name = "vehicle-plate-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
  "torch==2.6.0+cpu",
  "torchvision==0.21.0+cpu",

  "fastapi==0.139.0",
  "uvicorn==0.51.0",

  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
  "psycopg[binary]==3.3.4",

  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "email-validator==2.3.0",

  "python-dotenv==1.2.2",
  "python-jose==3.5.0",
  "python-multipart==0.0.32",
  "pwdlib==0.3.0",
  "argon2-cffi==25.1.0",

  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "pillow==11.2.1",

  "PyYAML==6.0.3",
  "requests==2.32.5",
  "scipy==1.15.3",
  "scikit-image==0.25.2",
  "python-bidi==0.6.6",
  "pyclipper==1.4.0",
  "shapely==2.1.2",
  "imageio==2.37.2",
  "tifffile==2025.6.11",
  "networkx==3.5",
  "lazy-loader==0.4",
  "matplotlib==3.10.5",
  "psutil==7.0.0",
  "polars==1.43.0",
  "ultralytics-thop==2.1.0",

  "easyocr==1.7.2",
  "ultralytics==8.4.93",
]

[tool.uv]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true