[project]
name = "vehicle-plate-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }